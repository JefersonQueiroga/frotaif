spring:
  application:
    name: frotaif
  datasource:
    url: jdbc:h2:mem:frotaif
    username: sa
    password:
  h2:
    console:
      enabled: true        # http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:frotaif)
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    defer-datasource-initialization: true   # executa o data.sql depois de criar as tabelas
  sql:
    init:
      mode: always

# Parâmetros de negócio (RN04) — lidos via @ConfigurationProperties
frota:
  viagem:
    antecedencia-minima-horas: 48
