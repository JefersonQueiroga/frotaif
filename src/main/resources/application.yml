spring:
  application:
    name: frotaif
  datasource:
    url: jdbc:h2:mem:frotaif
    username: sa
    password:
  h2:
    console:
      enabled: true        # http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:frotaif)
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    defer-datasource-initialization: true   # executa o data.sql depois de criar as tabelas
  sql:
    init:
      mode: always
  # Mostra a mensagem das exceções no corpo do erro (até termos o @RestControllerAdvice em t1-dto)
  web:
    error:
      include-message: always
      include-stacktrace: never

# Swagger UI: grupos em ordem alfabética
springdoc:
  swagger-ui:
    tags-sorter: alpha

# Parâmetros de negócio (RN04) — lidos via @ConfigurationProperties
frota:
  viagem:
    antecedencia-minima-horas: 24
  # Token JWT (JwtProperties). O segredo assina os tokens: quem o conhece consegue forjar um token.
  # Em produção, defina a variável de ambiente FROTA_JWT_SEGREDO (no mínimo 32 caracteres).
  jwt:
    segredo: ${FROTA_JWT_SEGREDO:frotaif-segredo-de-desenvolvimento-troque-em-producao}
    expiracao-minutos: 60
